[project]
name = "mosip-liveshield"
version = "0.1.0"
description = "Offline-first face capture, human detection and PAD integration scaffold"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "opencv-python>=4.10,<5.0",
  "numpy>=1.26,<3.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
vision = [
  "ultralytics>=8.3,<9.0",
  "transformers>=4.45,<5.0",
  "torch>=2.4",
  "pillow>=10.0",
]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
